# ============================================================================
# .github/workflows/docker.yml — Build + smoke test Docker image
# ============================================================================
# Runs on:
#   - push to main
#   - PRs to main
#   - manual trigger (workflow_dispatch)
#
# What it does:
#   1. Lint the Dockerfile with hadolint
#   2. Build the Docker image
#   3. Run a smoke test (start container, hit /health)
#   4. Print image size and metadata
#
# Everything runs on GitHub's cloud. Zero local risk.
# ============================================================================

name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================================
  # Job 1: Lint the Dockerfile (no build, just static analysis)
  # ==========================================================================
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013,DL3059
          # DL3008 — pin apt versions (we don't need to)
          # DL3013 — pin pip versions (we use ranges)
          # DL3059 — multiple consecutive RUN (cosmetic)

  # ==========================================================================
  # Job 2: Build the image + smoke test
  # ==========================================================================
  build:
    name: Build + Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: onyx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image size
        run: |
          echo "=== Image size ==="
          docker images onyx:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Start container (background)
        run: |
          docker run -d \
            --name onyx-test \
            -p 8000:8000 \
            -e OPENAI_API_KEY=dummy-key-for-smoke-test \
            -e OPENAI_BASE_URL=https://api.openai.com/v1 \
            -e LLM_MODEL=gpt-4o-mini \
            -e EMBED_MODEL=text-embedding-3-small \
            -e DATA_DIR=/tmp/onyx-data \
            -e LOG_LEVEL=WARNING \
            onyx:test

      - name: Wait for API to be ready
        run: |
          echo "=== Waiting for API to be ready ==="
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is up after ${i} attempts"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Smoke test — hit /health
        run: |
          echo "=== GET /health ==="
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          echo ""
          if grep -q '"status":"ok"' /tmp/health.json; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Smoke test — hit /skills
        run: |
          echo "=== GET /skills ==="
          curl -fsS http://localhost:8000/skills
          echo ""
          echo "✅ /skills endpoint responded"

      - name: Smoke test — hit /version
        run: |
          echo "=== GET /version ==="
          curl -fsS http://localhost:8000/version

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs onyx-test

      - name: Tear down
        if: always()
        run: |
          docker stop onyx-test || true
          docker rm onyx-test || true

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Image build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Container start | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| /health | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
          echo "| /skills | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
          echo "| /version | ✅ 200 |" >> $GITHUB_STEP_SUMMARY
