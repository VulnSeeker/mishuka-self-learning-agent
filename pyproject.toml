
# ============================================================================
# pyproject.toml — Onyx Self-Learning Agent
# ============================================================================
# Author : vulnseeker
# Repo   : onyx-self-learning-agent
# Agent  : Onyx
# ============================================================================

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"


# ============================================================================
# Project metadata
# ============================================================================

[project]
name = "onyx-self-learning-agent"
version = "0.1.0"
description = "Onyx — a self-learning AI agent that bootstraps skills from web research and builds its own knowledge bases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "vulnseeker", email = "vulnseeker@users.noreply.github.com" },
]
maintainers = [
    { name = "vulnseeker", email = "vulnseeker@users.noreply.github.com" },
]
keywords = [
    "onyx",
    "ai",
    "agent",
    "llm",
    "rag",
    "self-learning",
    "automation",
    "chromadb",
    "openai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ----------------------------------------------------------------------------
# Runtime dependencies
# ----------------------------------------------------------------------------
dependencies = [
    "openai>=1.40.0",
    "chromadb>=0.4.24",
    "duckduckgo-search>=6.1.0",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
]

# ----------------------------------------------------------------------------
# Optional feature groups
# ----------------------------------------------------------------------------
[project.optional-dependencies]
web = [
    "streamlit>=1.36.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]
docker = [
    "docker>=7.1.0",
]
graph = [
    "neo4j>=5.20.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
all = [
    "onyx-self-learning-agent[web,api,docker,graph,dev,docs]",
]

# ----------------------------------------------------------------------------
# CLI entry point
# ----------------------------------------------------------------------------
[project.scripts]
onyx = "onyx.cli:main"

# ----------------------------------------------------------------------------
# URLs
# ----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/vulnseeker/onyx-self-learning-agent"
Documentation = "https://github.com/vulnseeker/onyx-self-learning-agent#readme"
Repository = "https://github.com/vulnseeker/onyx-self-learning-agent"
Issues = "https://github.com/vulnseeker/onyx-self-learning-agent/issues"
Changelog = "https://github.com/vulnseeker/onyx-self-learning-agent/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/vulnseeker/onyx-self-learning-agent/issues"


# ============================================================================
# Hatchling — build configuration
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/onyx"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/data",
    "/.env",
    "/**/__pycache__",
]


# ============================================================================
# Ruff — linter + formatter
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "RUF",
]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004", "S101"]
"examples/**/*.py" = ["T201", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["onyx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false


# ============================================================================
# Mypy — static type checker
# ============================================================================

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "duckduckgo_search.*",
    "ddgs.*",
    "streamlit.*",
    "uvicorn.*",
]
ignore_missing_imports = true


# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=onyx",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests with no I/O",
    "integration: tests that touch SQLite/Chroma",
    "e2e: end-to-end tests (may hit network)",
    "slow: tests that take more than a few seconds",
    "live: tests that call real LLM APIs (opt-in)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:pydantic.*",
]


# ============================================================================
# Coverage
# ============================================================================

[tool.coverage.run]
source = ["src/onyx"]
branch = true
omit = [
    "*/__main__.py",
    "*/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false


# ============================================================================
# Tox — multi-environment test matrix
# ============================================================================

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312, lint, type
isolated_build = true

[testenv]
deps = -e .[dev]
commands = pytest {posargs}

[testenv:lint]
deps = ruff
commands = ruff check src tests
           ruff format --check src tests

[testenv:type]
deps = mypy
commands = mypy src
"""
